  default = """
<p>Filtrer lista over stiar; søket skil ikkje mellom store og små bokstavar og gjeld sti og tittel. %[%more Meir hjelp]</p>

<div>
<p>Desse nøkkelorda blir attkjende:</p>
<ul>
<li><em>at:start</em>, <em>at:end</em>: treff berre i starten eller slutten av sti eller tittel. Bruk begge for nøyaktig treff.</li>
<li><em>in:path</em>, <em>in:title</em>: treff berre sti eller tittel.</li>
<li><em>is:event</em>, <em>is:pageview</em>: vis berre hendingar eller sidevisingar.</li>
<li><em>:not</em>: snu treffet (det vil seie: vis berre stiar som ikkje samsvarar med filteret).</li>
</ul>
