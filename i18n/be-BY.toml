<li><code>_</code> адпавядае любому сімвалу; напрыклад, <code>_.html</code> адпавядае <code>a.html</code> і <code>b.html</code>.</li>
<li>Выкарыстоўвайце <code>\\%</code> і <code>\\_</code> для літаральных сімвалаў без спецыяльнага значэння.</li>
<li>Выкарыстоўвайце два бэкслэшы (<code>\\\\</code>), каб супаставіць адзін бэкслэш.</li>
</ul>
